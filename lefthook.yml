---

pre-commit:
  commands:
    namespace-limit:
      glob: "{flake/apps/**/*.nix,justfile,*.just}"
      run: >
        lefthook-namespace-limit flake/apps/default.nix
        $(find . -type f \( -name justfile -o -name '*.just' \) -print)
      timeout: 30s
    changelog-touched:
      run: lefthook-changelog-touched
      timeout: 30s
    ledger-ids:
      glob: "SPEC.md"
      run: lefthook-ledger-ids {staged_files}
      timeout: 30s
    gitleaks:
      run: lefthook-gitleaks {staged_files}
      timeout: 60s
    git-conflict-markers:
      run: lefthook-git-conflict-markers {staged_files}
      timeout: 30s
    git-no-local-paths:
      run: lefthook-git-no-local-paths {staged_files}
      timeout: 30s
    nix-flake-check:
      glob: "*.nix"
      run: timeout ${LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT:-600} nix flake check --option accept-flake-config false
    fragment-lint-output:
      glob: "*.{yml,yaml}"
      run: lefthook-fragment-lint-output {staged_files}
      timeout: 30s
    fragment-lint-timeout:
      glob: "setting/integrations/lefthook/*.{yml,yaml}"
      run: lefthook-fragment-lint-timeout {staged_files}
      timeout: 30s
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_ACTIONLINT_TIMEOUT:-30} lefthook-actionlint {staged_files}
    ci-lint-token:
      glob: "{flake.nix,.github/workflows/*.{yml,yaml}}"
      run: timeout ${LEFTHOOK_CI_LINT_TOKEN_TIMEOUT:-30} lefthook-ci-lint-token {staged_files}
      timeout: 30s
    ci-lint-qemu-order:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_QEMU_ORDER_TIMEOUT:-30} lefthook-ci-lint-qemu-order {staged_files}
      timeout: 30s
    ci-lint-sha:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_SHA_TIMEOUT:-30} lefthook-ci-lint-sha {staged_files}
      timeout: 30s
    nixfmt:
      glob: "*.nix"
      run: lefthook-nixfmt {staged_files}
      timeout: 30s
    statix:
      glob: "*.nix"
      run: lefthook-statix {staged_files}
      timeout: 30s
    deadnix:
      glob: "*.nix"
      run: lefthook-deadnix {staged_files}
      timeout: 30s
    nix-no-embedded-shell:
      glob: "*.nix"
      run: lefthook-nix-no-embedded-shell {staged_files}
      timeout: 30s
    leaf-import:
      glob: "flake/**/*.nix"
      run: lefthook-lint-leaf-import {staged_files}
      timeout: 30s
    watch-file:
      glob: "*.nix"
      run: lefthook-lint-watch-file {staged_files}
      timeout: 30s
    shellcheck:
      glob: "*.sh"
      run: lefthook-shellcheck {staged_files}
      timeout: 30s
    shfmt:
      glob: "*.sh"
      run: lefthook-shfmt {staged_files}
      timeout: 30s
    no-shell-functions:
      glob: "*.sh"
      run: lefthook-no-shell-functions {staged_files}
      timeout: 30s
    lint-noexec:
      glob: "*.{sh,yml,yaml}"
      run: lefthook-lint-noexec {staged_files}
      timeout: 30s
    unicode-lint:
      glob: "*"
      exclude: '\.(gif|png|jpg|jpeg|ico|webp|bmp|tiff|pdf|woff2?|ttf|eot|mp[34]|wav|ogg|zip|gz|tar|iso)$'
      run: timeout ${LEFTHOOK_UNICODE_LINT_TIMEOUT:-30} lefthook-unicode-lint {staged_files}
    lint-arch-diagram:
      glob: "README.md"
      run: lefthook-lint-arch-diagram {staged_files}
      timeout: 30s
    lint-badge-version:
      glob: "README.md"
      run: lefthook-lint-badge-version flake.nix README.md flake.lock
      timeout: 30s
    lint-badge-order:
      glob: "README.md"
      run: lefthook-lint-badge-order {staged_files}
      timeout: 30s
    markdownlint:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_TIMEOUT:-30} lefthook-markdownlint {staged_files}
    markdownlint-agentic:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT:-30} lefthook-markdownlint-agentic {staged_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: timeout ${LEFTHOOK_YAMLLINT_TIMEOUT:-30} lefthook-yamllint {staged_files}
    taplo:
      glob: "*.toml"
      run: timeout ${LEFTHOOK_TAPLO_TIMEOUT:-30} lefthook-taplo {staged_files}

pre-push:
  commands:
    linter-coverage:
      run: timeout ${LEFTHOOK_LINTER_COVERAGE_FULL_TIMEOUT:-30} lefthook-linter-coverage-full
    nix-flake-check:
      # NO glob. `nix flake check` validates the WHOLE tree -- markdown, YAML,
      # shell, dictionaries, the emitted lefthook config -- so gating it on
      # `*.nix` let every non-nix change reach CI ungated by it. CI runs it
      # unconditionally, which made green-local/red-CI structural for exactly
      # the changes least likely to be suspected: a config edit, a doc, a
      # fragment. Pre-commit keeps the glob; this is the gate before the push,
      # and it costs what CI costs.
      run: timeout ${LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT:-600} nix flake check --option accept-flake-config false
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_ACTIONLINT_TIMEOUT:-30} lefthook-actionlint {push_files}
    ci-lint-token:
      glob: "{flake.nix,.github/workflows/*.{yml,yaml}}"
      run: timeout ${LEFTHOOK_CI_LINT_TOKEN_TIMEOUT:-30} lefthook-ci-lint-token {push_files}
      timeout: 30s
    ci-lint-qemu-order:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_QEMU_ORDER_TIMEOUT:-30} lefthook-ci-lint-qemu-order {push_files}
      timeout: 30s
    ci-lint-sha:
      glob: ".github/workflows/*.{yml,yaml}"
      run: timeout ${LEFTHOOK_CI_LINT_SHA_TIMEOUT:-30} lefthook-ci-lint-sha {push_files}
      timeout: 30s
    nixfmt:
      glob: "*.nix"
      run: lefthook-nixfmt {push_files}
      timeout: 30s
    statix:
      glob: "*.nix"
      run: lefthook-statix {push_files}
      timeout: 30s
    deadnix:
      glob: "*.nix"
      run: lefthook-deadnix {push_files}
      timeout: 30s
    nix-no-embedded-shell:
      glob: "*.nix"
      run: lefthook-nix-no-embedded-shell {push_files}
      timeout: 30s
    leaf-import:
      glob: "flake/**/*.nix"
      run: lefthook-lint-leaf-import {push_files}
      timeout: 30s
    watch-file:
      glob: "*.nix"
      run: lefthook-lint-watch-file {push_files}
      timeout: 30s
    shellcheck:
      glob: "*.sh"
      run: lefthook-shellcheck {push_files}
      timeout: 30s
    shfmt:
      glob: "*.sh"
      run: lefthook-shfmt {push_files}
      timeout: 30s
    no-shell-functions:
      glob: "*.sh"
      run: lefthook-no-shell-functions {push_files}
      timeout: 30s
    lint-noexec:
      glob: "*.{sh,yml,yaml}"
      run: lefthook-lint-noexec {push_files}
      timeout: 30s
    lint-arch-diagram:
      glob: "README.md"
      run: lefthook-lint-arch-diagram {push_files}
      timeout: 30s
    markdownlint:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_TIMEOUT:-30} lefthook-markdownlint {push_files}
    markdownlint-agentic:
      glob: "*.md"
      run: timeout ${LEFTHOOK_MARKDOWNLINT_AGENTIC_TIMEOUT:-30} lefthook-markdownlint-agentic {push_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: timeout ${LEFTHOOK_YAMLLINT_TIMEOUT:-30} lefthook-yamllint {push_files}
    bats-parse:
      glob: "**/*.bats"
      run: timeout ${LEFTHOOK_BATS_PARSE_TIMEOUT:-30} lefthook-bats-parse {push_files}
    bats-unit:
      glob: "**/*.bats"
      run: LEFTHOOK_BATS_UNIT_JOBS=1 timeout ${LEFTHOOK_BATS_UNIT_TIMEOUT:-300} lefthook-bats-unit
    tdd-order-bats:
      run: >-
        timeout ${LEFTHOOK_TDD_ORDER_TIMEOUT:-30} lefthook-tdd-order-bats
    taplo:
      glob: "*.toml"
      run: timeout ${LEFTHOOK_TAPLO_TIMEOUT:-30} lefthook-taplo {push_files}

commit-msg:
  commands:
    commit-msg-lint:
      run: lefthook-commit-msg-lint {1}
      timeout: 30s
